<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Oceanic Niño Index (RONI) - Live Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; max-width: 1200px; margin-bottom: 20px; text-align: center; }
        h1 { color: #333; margin-bottom: 10px; }
        .header-controls { display: flex; justify-content: center; gap: 15px; align-items: center; }
        .jump-btn { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .jump-btn:hover { background-color: #0056b3; }
        .chart-container { width: 100%; max-width: 1200px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; overflow-x: auto; }
        #roniChart { min-width: 3000px; height: 600px !important; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #777; }
        footer { margin-top: 30px; font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>Relative Oceanic Niño Index (RONI) (1950-2026)</h1>
    <div class="header-controls">
        <button id="jumpToEnd" class="jump-btn">Jump to Present/End</button>
        <button id="jumpToStart" class="jump-btn">Jump to 1950</button>
    </div>
</header>

<div class="chart-container">
    <div class="loading" id="loadingIndicator">Loading data...</div>
    <canvas id="roniChart"></canvas>
</div>

<footer>
    Data Source: NOAA Climate Prediction Center - RONI Index<br>
    Plot updated: <span id="lastUpdated">Never</span><br>
    *Colors: El Niño (Red &ge; 0.5), La Niña (Blue &le; -0.5), Neutral (Grey).
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const lastUpdatedSpan = document.getElementById('lastUpdated');
        const chartContainer = document.querySelector('.chart-container');

        Papa.parse("roni_data.csv", {
            download: true,
            header: true,
            complete: function(results) {
                document.getElementById('loadingIndicator').style.display = 'none';
                if (results.data.length > 0) {
                    const latestDataPoint = results.data[results.data.length - 1];
                    if(latestDataPoint && latestDataPoint.date) {
                        lastUpdatedSpan.textContent = latestDataPoint.date;
                    }
                    renderChart(results.data);
                } else {
                    document.getElementById('loadingIndicator').textContent = "No data found in roni_data.csv.";
                }
            },
            error: function() {
                document.getElementById('loadingIndicator').textContent = "Waiting for the first automated scan to complete. Check back in a minute!";
            }
        });

        function renderChart(data) {
            // Filter out empty rows that might cause issues
            const validData = data.filter(row => row.date && row.roni);
            const dates = validData.map(row => row.date);
            const roniValues = validData.map(row => parseFloat(row.roni));
            const types = validData.map(row => row.type);

            const colors = types.map(type => {
                if (type === 'El Niño') return 'rgb(255, 99, 132)';
                if (type === 'La Niña') return 'rgb(54, 162, 235)';
                return 'rgb(201, 203, 207)';
            });

            const ctx = document.getElementById('roniChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'RONI Index',
                        data: roniValues,
                        backgroundColor: colors,
                        borderWidth: 1,
                        barPercentage: 1.0,
                        categoryPercentage: 1.0
                    }]
                },
                options: {
                    responsive: false, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { title: { display: true, text: 'RONI Index Value' }, ticks: { stepSize: 0.5 } },
                        x: {
                            grid: { 
                                color: 'rgba(0,0,0,0.05)', 
                                // This is the fixed line that prevents the crash:
                                lineWidth: (context) => (context.tick && context.tick.label && String(context.tick.label).includes('-01')) ? 1 : 0 
                            },
                            ticks: {
                                autoSkip: false, maxRotation: 90, minRotation: 90,
                                callback: function(val, index) { return dates[index] && dates[index].includes('-01') ? dates[index] : ''; }
                            }
                        }
                    }
                }
            });

            document.getElementById('jumpToEnd').addEventListener('click', () => { chartContainer.scrollLeft = chartContainer.scrollWidth; });
            document.getElementById('jumpToStart').addEventListener('click', () => { chartContainer.scrollLeft = 0; });
            setTimeout(() => { chartContainer.scrollLeft = chartContainer.scrollWidth; }, 100);
        }
    });
</script>
</body>
</html>
