name: Update RONI Data and Chart

on:
  schedule:
    - cron: '0 2 1 * *' # Runs 1st of every month
  workflow_dispatch: # THIS is the line that creates the "Run workflow" button!

jobs:
  update_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4 to fix deprecation warning

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5 to fix deprecation warning
        with:
          python-version: '3.10' # Fixed syntax from python_version to python-version

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python update_roni.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add roni_data.csv
          
          # Only commit and push if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update RONI data"
            git push
          fi
