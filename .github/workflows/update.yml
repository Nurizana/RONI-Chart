name: Update RONI Data and Chart

on:
  schedule:
    - cron: '0 2 1 * *' # Runs 1st of every month
  workflow_dispatch: # THIS is the line that creates the "Run workflow" button!

jobs:
  update_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python_version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python update_roni.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add roni_data.csv
          git commit -m "Auto-update RONI data" || echo "No changes to commit."
          git push
